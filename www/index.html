<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio Pro</title>
    <style>
        body { font-family: sans-serif; background: #090d16; color: #fff; padding: 16px; margin: 0; }
        .card { background: #131b2e; border: 1px solid #1f293d; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 8px; font-weight: bold; }
        select, textarea { width: 100%; background: #0d1322; border: 1px solid #1f293d; color: #fff; padding: 12px; border-radius: 8px; margin-bottom: 14px; box-sizing: border-box; }
        .btn { background: #6366f1; color: #fff; border: none; width: 100%; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .output-box { background: #070a10; border: 1px solid #1f293d; border-radius: 8px; padding: 14px; min-height: 100px; white-space: pre-wrap; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>🎬 AI Studio Pro (gemma4:cloud)</h2>
    <div class="card">
        <label>মডেল: gemma4:cloud (Ollama Ready)</label>
        <textarea id="prompt" rows="4" placeholder="আপনার প্রম্পট লিখুন..."></textarea>
        <button class="btn" onclick="alert('Ready!')">জেনারেট করুন ✨</button>
    </div>
    <div class="card">
        <label>আউটপুট</label>
        <div class="output-box" id="output">ফলাফল এখানে আসবে...</div>
    </div>
</body>
</html>
