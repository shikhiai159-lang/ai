<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio Pro - Standalone Engine</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #131b2e;
            --primary: #6366f1;
            --accent: #10b981;
            --danger: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #1f293d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-dark); color: var(--text-main); padding: 16px; padding-bottom: 40px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
        .header h1 { font-size: 18px; font-weight: 700; color: #fff; }
        .status-badge { font-size: 11px; background: rgba(239, 68, 68, 0.15); color: var(--danger); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(239, 68, 68, 0.3); }
        .status-badge.active { background: rgba(16, 185, 129, 0.15); color: var(--accent); border-color: rgba(16, 185, 129, 0.3); }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
        select, input, textarea { width: 100%; background: #0d1322; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 14px; outline: none; }
        .btn { background: var(--primary); color: #fff; border: none; width: 100%; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        .btn-success { background: #10b981; }
        .btn-secondary { background: #1e293b; border: 1px solid var(--border); }
        .output-box { background: #070a10; border: 1px solid var(--border); border-radius: 8px; padding: 14px; min-height: 120px; white-space: pre-wrap; font-size: 14px; line-height: 1.6; margin-top: 10px; word-break: break-word; }
        .progress-bar { width: 100%; background: #0d1322; border-radius: 8px; overflow: hidden; height: 10px; margin-bottom: 10px; display: none; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎬 AI Studio Pro</h1>
        <div class="status-badge" id="statusIndicator">Engine Checking...</div>
    </div>

    <!-- ⚙️ 1. Standalone Engine & Model Manager -->
    <div class="card" style="border-color: #3b82f6;">
        <label>⚙️ ১. ইন-অ্যাপ ওলামা ইঞ্জিনিয়ারিং কনফিগারেশন</label>
        <button class="btn btn-secondary" onclick="checkOllamaHealth()">সার্ভার স্ট্যাটাস রিফ্রেশ করুন 🔄</button>
        
        <div id="setupControls">
            <label>মডেল ইনস্টল / ডাউনলোড (Pull Model)</label>
            <input type="text" id="pullModelName" value="gemma4:cloud" placeholder="মডেলের নাম লিখুন...">
            <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
            <button class="btn btn-success" onclick="pullOllamaModel()">ডাউনলোড / ইনস্টল মডেল 📥</button>
        </div>
    </div>

    <!-- 📝 2. Feature Workspaces -->
    <div class="card">
        <label>২. এআই ইঞ্জিন এবং কাজের ক্যাটাগরি</label>
        <select id="taskType">
            <option value="blog">📝 এসইও ফ্রেন্ডলি ব্লগ পোস্ট রাইটিং (SEO Blog Post)</option>
            <option value="video_script">🎬 ভিডিও সিন স্ক্রিপ্ট ও ভয়েসওভার (Video Script & Voiceover)</option>
            <option value="thumbnail">🎨 ইউটিউব থাম্বনেল আইডিয়া ও প্রম্পট (Thumbnail Ideas)</option>
            <option value="social">📲 সোশ্যাল মিডিয়া পোস্ট ও হ্যাশট্যাগ (Social Media & Captions)</option>
            <option value="seo">🔍 এসইও মেটা টাইটেল ও ডেসক্রিপশন (SEO Meta Generator)</option>
        </select>

        <label>৩. টপিক / প্রম্পট</label>
        <textarea id="userPrompt" rows="4" placeholder="আপনার টপিক লিখুন..."></textarea>

        <button class="btn" onclick="processAIRequest()">জেনারেট করুন ✨</button>
    </div>

    <!-- 📤 3. Output -->
    <div class="card">
        <label>৪. আউটপুট</label>
        <div class="output-box" id="resultBox">ইঞ্জিন রেডি হলে উত্তর এখানে দেখাবে...</div>
    </div>

    <script>
        const OLLAMA_HOST = "http://localhost:11434";

        async function checkOllamaHealth() {
            const badge = document.getElementById('statusIndicator');
            try {
                const res = await fetch(`${OLLAMA_HOST}/api/tags`);
                if (res.ok) {
                    badge.innerText = "Local Engine Active";
                    badge.className = "status-badge active";
                } else {
                    throw new Error();
                }
            } catch (e) {
                badge.innerText = "Engine Disconnected";
                badge.className = "status-badge";
            }
        }

        async function pullOllamaModel() {
            const modelName = document.getElementById('pullModelName').value.trim();
            const resultBox = document.getElementById('resultBox');
            if(!modelName) return alert("মডেল নাম লিখুন!");

            resultBox.innerText = `মডেল (${modelName}) ব্যাকগ্রাউন্ডে ইনস্টল হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন।`;
            
            try {
                const res = await fetch(`${OLLAMA_HOST}/api/pull`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: modelName, stream: false })
                });

                if(res.ok) {
                    resultBox.innerText = `সফলভাবে ${modelName} মডেল ইনস্টল সম্পন্ন হয়েছে! এখন জেনারেট করতে পারেন।`;
                    checkOllamaHealth();
                } else {
                    resultBox.innerText = "মডেল ইনস্টল করা সম্ভব হয়নি। ব্যাকগ্রাউন্ড বাইনারি রান হচ্ছে কিনা তা নিশ্চিত করুন।";
                }
            } catch(e) {
                resultBox.innerText = "ত্রুটি: সার্ভারের সাথে কানেক্ট করা যায়নি। " + e.message;
            }
        }

        async function processAIRequest() {
            const task = document.getElementById('taskType').value;
            const promptText = document.getElementById('userPrompt').value.trim();
            const modelName = document.getElementById('pullModelName').value.trim();
            const resultBox = document.getElementById('resultBox');

            if (!promptText) return alert('দয়া করে বিষয়বস্তু লিখুন!');

            resultBox.innerText = "এআই দিয়ে প্রসেস করা হচ্ছে... ⏳";

            let promptPrefix = "";
            if (task === "blog") promptPrefix = "Write an SEO blog post in Bengali for: ";
            else if (task === "video_script") promptPrefix = "Create a scene-by-scene Bengali video script for: ";
            else if (task === "thumbnail") promptPrefix = "Generate high CTR YouTube thumbnail prompts in Bengali for: ";
            else if (task === "social") promptPrefix = "Write social media captions with hashtags in Bengali for: ";
            else promptPrefix = "Generate SEO titles and descriptions in Bengali for: ";

            try {
                const res = await fetch(`${OLLAMA_HOST}/api/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: modelName, prompt: promptPrefix + promptText, stream: false })
                });

                if(!res.ok) throw new Error("Ollama Engine কানেক্ট করা যায়নি।");
                const data = await res.json();
                resultBox.innerText = data.response;
            } catch(err) {
                resultBox.innerText = "ত্রুটি ঘটেছে: " + err.message + "\n\n(অ্যাপটি থেকে অটো-ইঞ্জিন স্টার্ট হতে কিছুটা সময় লাগলে রিফ্রেশ বা ব্যাকগ্রাউন্ড পারমিশন চেক করুন।)";
            }
        }

        // Auto check on load
        checkOllamaHealth();
    </script>
</body>
</html>
