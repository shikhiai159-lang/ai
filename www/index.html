<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio Pro</title>
    <style>
        :root { --bg-dark: #090d16; --card-bg: #131b2e; --primary: #6366f1; --accent: #10b981; --danger: #ef4444; --text-main: #f3f4f6; --text-muted: #9ca3af; --border: #1f293d; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: var(--bg-dark); color: var(--text-main); padding: 16px; padding-bottom: 40px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
        .header h1 { font-size: 18px; font-weight: 700; color: #fff; }
        .status-badge { font-size: 11px; background: rgba(239, 68, 68, 0.15); color: var(--danger); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(239, 68, 68, 0.3); }
        .status-badge.active { background: rgba(16, 185, 129, 0.15); color: var(--accent); border-color: rgba(16, 185, 129, 0.3); }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
        select, input, textarea { width: 100%; background: #0d1322; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 14px; outline: none; }
        .btn { background: var(--primary); color: #fff; border: none; width: 100%; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        .btn-success { background: #10b981; }
        .btn-secondary { background: #1e293b; border: 1px solid var(--border); }
        .output-box { background: #070a10; border: 1px solid var(--border); border-radius: 8px; padding: 14px; min-height: 120px; white-space: pre-wrap; font-size: 14px; line-height: 1.6; margin-top: 10px; word-break: break-word; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎬 AI Studio Pro</h1>
        <div class="status-badge" id="statusIndicator">Checking...</div>
    </div>

    <div class="card">
        <label>⚙️ ১. ইন-অ্যাপ ইঞ্জিন ডায়াগনস্টিকস</label>
        <button class="btn btn-secondary" onclick="checkOllamaHealth()">ইঞ্জিন টেস্ট করুন 🔄</button>
        
        <label>মডেল নাম</label>
        <input type="text" id="pullModelName" value="gemma4:cloud">
        <button class="btn btn-success" id="pullBtn" onclick="pullOllamaModel()">ডাউনলোড / ইনস্টল চেষ্টা করুন 📥</button>
    </div>

    <div class="card">
        <label>২. কাজের ক্যাটাগরি</label>
        <select id="taskType">
            <option value="blog">📝 এসইও ফ্রেন্ডলি ব্লগ পোস্ট রাইটিং (SEO Blog Post)</option>
            <option value="video_script">🎬 ভিডিও সিন স্ক্রিপ্ট ও ভয়েসওভার (Video Script & Voiceover)</option>
            <option value="thumbnail">🎨 ইউটিউব থাম্বনেল আইডিয়া ও প্রম্পট (Thumbnail Ideas)</option>
        </select>

        <label>৩. টপিক / প্রম্পট</label>
        <textarea id="userPrompt" rows="4" placeholder="আপনার টপিক লিখুন..."></textarea>

        <button class="btn" onclick="processAIRequest()">জেনারেট করুন ✨</button>
    </div>

    <div class="card">
        <label>৪. ফলাফল / সার্ভিস এরর লগ</label>
        <div class="output-box" id="resultBox">রেসপন্স বা এরর তথ্য এখানে দেখাবে...</div>
    </div>

    <script>
        const OLLAMA_HOST = "http://localhost:11434";

        async function checkOllamaHealth() {
            const badge = document.getElementById('statusIndicator');
            const resultBox = document.getElementById('resultBox');
            try {
                const res = await fetch(`${OLLAMA_HOST}/api/tags`, { method: 'GET' });
                if (res.ok) {
                    badge.innerText = "Engine Active (Port 11434 Connected)";
                    badge.className = "status-badge active";
                    resultBox.innerText = "সার্ভার সক্রিয় আছে। আপনি মডেল ব্যবহার করতে পারেন।";
                } else {
                    throw new Error("Port open but non-200 response");
                }
            } catch (e) {
                badge.innerText = "Engine Disconnected";
                badge.className = "status-badge";
                resultBox.innerText = "লগ: লোকাল সার্ভার পাওয়া যায়নি (Failed to connect to " + OLLAMA_HOST + ")। ব্যাকগ্রাউন্ড নেটিভ সার্ভিস চালু হওয়া প্রয়োজন।";
            }
        }

        async function pullOllamaModel() {
            const btn = document.getElementById('pullBtn');
            const modelName = document.getElementById('pullModelName').value.trim();
            const resultBox = document.getElementById('resultBox');
            
            btn.disabled = true;
            btn.innerText = "প্রসেস করা হচ্ছে...";
            resultBox.innerText = `কানেক্ট করার চেষ্টা চলছে (${modelName})...`;

            try {
                const res = await fetch(`${OLLAMA_HOST}/api/pull`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: modelName, stream: false })
                });

                if(res.ok) {
                    resultBox.innerText = `সফলভাবে ${modelName} মডেলের জন্য রিকোয়েস্ট এক্সেপ্ট হয়েছে!`;
                } else {
                    resultBox.innerText = "সার্ভার এরর: " + res.status + " " + res.statusText;
                }
            } catch(e) {
                resultBox.innerText = "বাটন ট্র্যাকিং লগ: ব্যাকগ্রাউন্ড লোকাল সার্ভার অফ থাকায় ফেচ ফেল করেছে (" + e.message + ")।";
            } finally {
                btn.disabled = false;
                btn.innerText = "ডাউনলোড / ইনস্টল মডেল 📥";
            }
        }

        async function processAIRequest() {
            const task = document.getElementById('taskType').value;
            const promptText = document.getElementById('userPrompt').value.trim();
            const modelName = document.getElementById('pullModelName').value.trim();
            const resultBox = document.getElementById('resultBox');

            if (!promptText) return alert('দয়া করে বিষয়বস্তু লিখুন!');

            resultBox.innerText = "প্রসেস করা হচ্ছে... ⏳";
            let promptPrefix = task === "blog" ? "Write an SEO blog in Bengali: " : "Create video script in Bengali: ";

            try {
                const res = await fetch(`${OLLAMA_HOST}/api/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: modelName, prompt: promptPrefix + promptText, stream: false })
                });

                if(!res.ok) throw new Error("Ollama Engine রেসপন্স দেয়নি।");
                const data = await res.json();
                resultBox.innerText = data.response;
            } catch(err) {
                resultBox.innerText = "ত্রুটি: " + err.message;
            }
        }

        checkOllamaHealth();
    </script>
</body>
</html>
