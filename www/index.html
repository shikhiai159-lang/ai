<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio Pro - Standalone</title>
    <style>
        :root { --bg-dark: #090d16; --card-bg: #131b2e; --primary: #6366f1; --accent: #10b981; --danger: #ef4444; --text-main: #f3f4f6; --text-muted: #9ca3af; --border: #1f293d; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: var(--bg-dark); color: var(--text-main); padding: 16px; padding-bottom: 40px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
        .header h1 { font-size: 18px; font-weight: 700; color: #fff; }
        .status-badge { font-size: 11px; background: rgba(239, 68, 68, 0.15); color: var(--danger); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(239, 68, 68, 0.3); }
        .status-badge.active { background: rgba(16, 185, 129, 0.15); color: var(--accent); border-color: rgba(16, 185, 129, 0.3); }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
        select, input, textarea { width: 100%; background: #0d1322; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 14px; outline: none; }
        .btn { background: var(--primary); color: #fff; border: none; width: 100%; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        .btn-success { background: #10b981; }
        .btn-secondary { background: #1e293b; border: 1px solid var(--border); }
        .output-box { background: #070a10; border: 1px solid var(--border); border-radius: 8px; padding: 14px; min-height: 120px; white-space: pre-wrap; font-size: 14px; line-height: 1.6; margin-top: 10px; word-break: break-word; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎬 AI Studio Pro (Standalone)</h1>
        <div class="status-badge" id="engineStatus">ইঞ্জিন চেক করা হচ্ছে...</div>
    </div>

    <div class="card" style="border-color: #3b82f6;">
        <label>⚙️ ১. ইন-অ্যাপ ওলামা ইঞ্জিন ও মডেল সেটআপ</label>
        <button class="btn btn-secondary" onclick="checkEngine()">ইঞ্জিন স্ট্যাটাস রিফ্রেশ করুন 🔄</button>
        
        <label>ডিফল্ট মডেল (Gemma 4 Cloud / Local)</label>
        <input type="text" id="targetModel" value="gemma4:cloud">
        <button class="btn btn-success" id="downloadBtn" onclick="downloadModel()">মডেল ডাউনলোড ও ইনস্টল করুন 📥</button>
    </div>

    <div class="card">
        <label>২. ক্রিয়েটর স্টুডিও ক্যাটাগরি</label>
        <select id="taskType">
            <option value="blog">📝 এসইও ফ্রেন্ডলি ব্লগ পোস্ট রাইটিং (SEO Blog)</option>
            <option value="video_script">🎬 ভিডিও সিন স্ক্রিপ্ট ও ভয়েসওভার (Video Script)</option>
            <option value="thumbnail">🎨 ইউটিউব থাম্বনেল আইডিয়া ও প্রম্পট (Thumbnail Ideas)</option>
        </select>

        <label>৩. আপনার টপিক লিখুন</label>
        <textarea id="userPrompt" rows="4" placeholder="যেমন: সেরা এআই টুলস ২০২৬..."></textarea>

        <button class="btn" onclick="runGeneration()">জেনারেট করুন ✨</button>
    </div>

    <div class="card">
        <label>৪. ফলাফল / ইঞ্জিন লগ</label>
        <div class="output-box" id="outputBox">ইঞ্জিন রেডি হলে ফলাফল এখানে দেখাবে...</div>
    </div>

    <script>
        const HOST = "http://localhost:11434";

        async function checkEngine() {
            const badge = document.getElementById('engineStatus');
            const box = document.getElementById('outputBox');
            try {
                const res = await fetch(`${HOST}/api/tags`);
                if (res.ok) {
                    badge.innerText = "Embedded Engine Active ✅";
                    badge.className = "status-badge active";
                    box.innerText = "লোকাল ইঞ্জিন সফলভাবে ব্যাকগ্রাউন্ডে সচল রয়েছে!";
                } else {
                    throw new Error();
                }
            } catch (e) {
                badge.innerText = "Engine Starting... ⏳";
                badge.className = "status-badge";
                box.innerText = "ইঞ্জিন ব্যাকগ্রাউন্ডে চালু হচ্ছে। একটু সময় দিন অথবা 'স্ট্যাটাস রিফ্রেশ করুন' বাটনে চাপ দিন।";
            }
        }

        async function downloadModel() {
            const model = document.getElementById('targetModel').value.trim();
            const box = document.getElementById('outputBox');
            box.innerText = `মডেল (${model}) ডাউনলোড ও কনফিগার শুরু হয়েছে... অনুগ্রহ করে অপেক্ষা করুন।`;

            try {
                const res = await fetch(`${HOST}/api/pull`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: model, stream: false })
                });
                if(res.ok) {
                    box.innerText = `সফলভাবে ${model} মডেল ইনস্টল সম্পন্ন হয়েছে! এখন আপনি যেকোনো প্রম্পট রান করতে পারবেন।`;
                    checkEngine();
                } else {
                    box.innerText = "মডেল ইনস্টল করার সময় সার্ভার রেসপন্স দেয়নি। ইঞ্জিন সচল আছে কিনা নিশ্চিত করুন।";
                }
            } catch(e) {
                box.innerText = "ত্রুটি: সার্ভারের সাথে কানেক্ট করা যায়নি (" + e.message + ")।";
            }
        }

        async function runGeneration() {
            const task = document.getElementById('taskType').value;
            const prompt = document.getElementById('userPrompt').value.trim();
            const model = document.getElementById('targetModel').value.trim();
            const box = document.getElementById('outputBox');

            if (!prompt) return alert('দয়া করে কিছু লিখুন!');

            box.innerText = "এআই প্রসেস করছে... ⏳";
            let prefix = task === "blog" ? "Write an SEO blog post in Bengali for: " : "Create a video script in Bengali for: ";

            try {
                const res = await fetch(`${HOST}/api/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: model, prompt: prefix + prompt, stream: false })
                });

                if(!res.ok) throw new Error("ইঞ্জিন থেকে আউটপুট পাওয়া যায়নি।");
                const data = await res.json();
                box.innerText = data.response;
            } catch(err) {
                box.innerText = "ত্রুটি: " + err.message;
            }
        }

        checkEngine();
    </script>
</body>
</html>
